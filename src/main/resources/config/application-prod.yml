# Perfil de produção: só o que difere do padrão, e por propriedade.
logging:
  level:
    root: INFO
    # A depuração não existe em produção. Um teste confere que nenhum pacote do projeto fica abaixo
    # de INFO.
    br.com.alelo.consumer: INFO
  file:
    # O destino local é o único: o log pode conter dado de clientes, e nenhum appender remoto é
    # configurado. O diretório logs/ não é versionado.
    name: logs/consumer-pat.log
  logback:
    # Arquivo sem rotação cresce até encher o disco, e o histórico some quando mais se precisa dele.
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB
