# Perfil de produção: só o que difere do padrão, e por propriedade.
logging:
  level:
    root: INFO
    # A depuração não existe em produção. Um teste confere que nenhum pacote do projeto fica abaixo
    # de INFO.
    br.com.alelo.consumer: INFO
  file:
    # O destino local é o único: o log pode conter dado de clientes, e nenhum appender remoto é
    # configurado. O diretório logs/ não é versionado.
    name: logs/consumer-pat.log
  logback:
    # Arquivo sem rotação cresce até encher o disco, e o histórico some quando mais se precisa dele.
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB
spring:
  h2:
    console:
      # O console do H2 com sa/sa dá leitura e escrita irrestritas no banco pelo navegador:
      # contorna a API, a validação e a trava do saldo. O perfil padrão o mantém, porque o README
      # do desafio o documenta; produção nunca. O web-allow-others segue no padrão, falso: só a
      # própria máquina.
      enabled: false
springdoc:
  swagger-ui:
    # O contrato não precisa estar público em produção, e a página carrega recursos que a política
    # de conteúdo dos cabeçalhos de segurança não permite.
    enabled: false
  api-docs:
    enabled: false
