name: Markdownlint

on:
  workflow_call:

jobs:
  markdownlint:
    name: Verificar Markdown
    runs-on: [self-hosted, linux, x64, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # markdownlint-cli2 já vem pré-instalado na imagem do runner (pacman).
      - name: Verificar documentação
        run: markdownlint-cli2 "**/*.md"
